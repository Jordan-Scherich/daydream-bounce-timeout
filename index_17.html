<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daydream Screensaver</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0a26;cursor:none;}
  #stage{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(circle at 50% 28%, #2a1666 0%, #17103f 45%, #0d0a26 78%);}
  /* soft drifting glow blobs */
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none;}
  .b1{width:44vw;height:44vw;background:#7b2ff7;left:-10vw;top:-8vw;animation:drift1 46s ease-in-out infinite;}
  .b2{width:38vw;height:38vw;background:#e83ea0;right:-8vw;bottom:-10vw;animation:drift2 54s ease-in-out infinite;}
  .b3{width:30vw;height:30vw;background:#37e0e8;right:20vw;top:-6vw;opacity:.22;animation:drift1 62s ease-in-out infinite reverse;}
  @keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(6vw,5vh);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-7vw,-4vh);}}
  /* stars */
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.2;}50%{opacity:.9;}}
  /* moving block */
  #block{position:absolute;left:0;top:0;will-change:transform;text-align:center;
    filter:drop-shadow(0 0 34px rgba(232,62,160,.55));transition:filter 1.2s ease;}
  #block img{display:block;width:34vw;min-width:340px;max-width:640px;height:auto;margin:0 auto;}
  #tag{margin-top:14px;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;
    font-size:clamp(1.4rem,3.4vw,3rem);letter-spacing:.5px;
    background:linear-gradient(100deg,#ffd23f,#ff9d3f,#ff6ea9,#e83ea0,#9d4edd,#37e0e8,#ffd23f);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 10s linear infinite;}
  @keyframes shine{0%{background-position:300% 50%;}100%{background-position:0% 50%;}}
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
    font-family:system-ui,sans-serif;color:#cfc6f0;font-size:.9rem;font-weight:700;
    background:rgba(20,14,46,.72);border:1px solid #2c2456;padding:9px 18px;border-radius:999px;
    transition:opacity 1s ease;cursor:pointer;}
  #hint.gone{opacity:0;pointer-events:none;}
  @media (prefers-reduced-motion:reduce){ .blob,.star,#tag{animation:none;} }
</style>
</head>

<script>
(function(){
  var stage=document.getElementById('stage'), block=document.getElementById('block'), hint=document.getElementById('hint');
  // stars
  for(var i=0;i<70;i++){ var s=document.createElement('div'); s.className='star';
    var sz=Math.random()*2+1; s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(Math.random()*4)+'s'; stage.appendChild(s); }

  var x=60, y=60, vx=70, vy=52, hue=320, last=null;
  function bounds(){ return { w:stage.clientWidth, h:stage.clientHeight, bw:block.offsetWidth, bh:block.offsetHeight }; }
  var b=bounds();
  x=Math.random()*Math.max(1,(b.w-b.bw)); y=Math.random()*Math.max(1,(b.h-b.bh));
  if(Math.random()<.5) vx=-vx; if(Math.random()<.5) vy=-vy;

  function frame(t){
    if(last==null) last=t; var dt=Math.min(0.05,(t-last)/1000); last=t;
    var d=bounds(); var maxX=Math.max(0,d.w-d.bw), maxY=Math.max(0,d.h-d.bh);
    x+=vx*dt; y+=vy*dt; var hit=false;
    if(x<=0){x=0;vx=Math.abs(vx);hit=true;} else if(x>=maxX){x=maxX;vx=-Math.abs(vx);hit=true;}
    if(y<=0){y=0;vy=Math.abs(vy);hit=true;} else if(y>=maxY){y=maxY;vy=-Math.abs(vy);hit=true;}
    block.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
    if(hit){ hue=(hue+47)%360; block.style.filter='drop-shadow(0 0 40px hsla('+hue+',90%,62%,.6))'; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // full screen on click/tap
  function fs(){ var el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }
  document.addEventListener('click', fs);
  document.addEventListener('keydown', function(e){ if(e.key==='f'||e.key==='F') fs(); });
  setTimeout(function(){ hint.classList.add('gone'); }, 6000);

  // keep cursor hidden but reveal briefly on move
  var ct; document.addEventListener('mousemove', function(){ document.body.style.cursor='default'; clearTimeout(ct); ct=setTimeout(function(){ document.body.style.cursor='none'; }, 2500); });
})();
</script>
